<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>ERP HR — لوحة الإدارة</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; }
      * { box-sizing: border-box; }
      button { cursor: pointer; }
      input, select, textarea { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; width: 100%; font-family: inherit; }
      .btn { padding: 8px 16px; border: none; border-radius: 6px; background: #0d9488; color: white; font-weight: 600; }
      .btn:hover { background: #0f766e; }
      .btn-danger { background: #dc2626; }
      .btn-danger:hover { background: #b91c1c; }
      .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.06); margin-bottom: 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px; text-align: right; border-bottom: 1px solid #eee; }
      th { background: #f9fafb; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
